<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selamat Ulang Tahun</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #ffd6e8;
    font-family: "Poppins", sans-serif;
    overflow-x: hidden;
  }.container { text-align: center; padding: 60px 20px; }

h1 { font-size: 2.5rem; color: #ff4f9a; margin-bottom: 20px; font-weight: 700; }

.typing { font-size: 1.3rem; color: #333; width: 90%; margin: auto; border-right: 3px solid #ff4f9a; white-space: nowrap; overflow: hidden; animation: typing 4s steps(40, end), blink .7s infinite; }

@keyframes typing { from { width: 0; } to { width: 90%; } }

@keyframes blink { 50% { border-color: transparent; } }

.btn { margin-top: 40px; padding: 12px 25px; background: #ff4f9a; color: white; border: none; border-radius: 15px; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 0, 90, 0.3); transition: 0.3s; }

.btn:hover { transform: scale(1.05); background: #ff2d85; }

.hearts { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }

.heart { position: absolute; color: #ff4f9a; font-size: 20px; animation: floatUp 4s linear infinite; }

@keyframes floatUp { 0% { transform: translateY(100vh) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1.4); opacity: 0; } } </style>

</head>
<body><div class="hearts" id="hearts"></div><div class="container">
  <h1>🎉 Selamat Ulang Tahun 🎉</h1>  <p class="typing">Aku cuma mau bilang... terima kasih sudah hadir dan bikin hari-hari aku jauh lebih indah. Semoga hari ini jadi hari yang paling manis buat kamu. 💗</p><button class="btn" onclick="playMusic()">Klik untuk Mendengar Pesan</button>

</div><audio id="music" src="lagu.mp3"></audio>

<script>
function playMusic() {
  document.getElementById("music").play();
}

// Floating hearts
function generateHearts() {
  const hearts = document.getElementById("hearts");
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = 3 + Math.random() * 3 + "s";
  hearts.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}

setInterval(generateHearts, 300);
</script></body>
</html>
