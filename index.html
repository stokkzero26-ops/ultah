<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu 💗</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(45deg, #ffb6d9, #ffd9ec);
    font-family: "Poppins", sans-serif;
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    margin-top: 60px;
    color: #ff3f89;
    font-size: 2.4rem;
    font-weight: 700;
  }

  .typing {
    width: 90%;
    margin: 20px auto;
    font-size: 1.3rem;
    text-align: center;
    color: #333;
    border-right: 3px solid #ff3f89;
    white-space: nowrap;
    overflow: hidden;
    animation: typing 4s steps(50), blink .6s infinite;
  }

  @keyframes typing { from { width: 0 } to { width: 90% } }
  @keyframes blink { 50% { border-color: transparent } }

  .btn {
    display: block;
    margin: 35px auto;
    padding: 13px 30px;
    background: #ff3f89;
    color: white;
    border-radius: 18px;
    font-size: 1.2rem;
    text-decoration: none;
    text-align: center;
    width: fit-content;
    box-shadow: 0 0 14px rgba(255, 0, 120, .3);
    transition: .3s;
  }

  .btn:hover {
    transform: scale(1.05);
    background: #ff2477;
  }

  /* hearts */
  .heart {
    position: fixed;
    top: -10px;
    color: #ff2e7d;
    font-size: 22px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh); opacity: 0; }
  }
</style>
</head>
<body>

<h1>💗 Untuk Kamu yang Spesial 💗</h1>

<p class="typing">
Aku cuma mau bilang... kamu itu punya cara sendiri buat bikin aku nyaman.
</p>

<a class="btn" onclick="playMusic()">Klik untuk dengar pesannya 💞</a>

<!-- AUDIO (PLAY SETELAH DIKLIK) -->
<audio id="bgmusic">
  <source src="https://files.catbox.moe/0mcc0p.mp3" type="audio/mp3">
</audio>

<script>
function playMusic() {
  const audio = document.getElementById("bgmusic");
  audio.play();
  alert("💗 Musik sedang diputar, semoga kamu suka 💗");
}

// hearts animation
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = 2 + Math.random() * 3 + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 4500);
}, 300);
</script>

</body>
</html>
