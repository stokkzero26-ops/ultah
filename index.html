<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun 💖</title>
<style>
body {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: "Poppins", sans-serif;
  text-align: center;
  padding: 50px;
  color: #fff;
}
h1 {
  font-size: 2.5em;
  animation: fadeIn 2s ease;
}
p {
  font-size: 1.3em;
  margin-top: 20px;
}
button {
  background: #fff;
  color: #ff6f91;
  border: none;
  padding: 10px 20px;
  font-size: 1em;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 30px;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<h1>🎉 Selamat Ulang Tahun, Sayang! 🎂</h1>
<p>Semoga hari kamu seindah senyum kamu hari ini 💕</p>
<button onclick="playMusic()">Putar Musik 🎶</button>
<audio id="music" src="https://files.catbox.moe/1xwz8z.mp3"></audio>
<script>
function playMusic() {
  document.getElementById("music").play();
  alert("💖 Selamat menikmati harimu ya 💖");
}
</script>
</body>
</html>
